<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The same as applicationIcon() (src/app/Theme.cpp): a speech bubble,
       its tail at the bottom left, with Argonaut's boat in it. -->
  <defs>
    <linearGradient id="bubble" x1="0" y1="12" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="12" width="112" height="88" rx="30" fill="url(#bubble) #3584e4"/>
  <polygon points="26,88 14,120 54,98" fill="url(#bubble) #3584e4"/>
  <g transform="translate(64 58) scale(0.8) translate(-66 -76)">
    <line x1="66" y1="54" x2="66" y2="90" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <polygon points="70,55 92,86 70,86" fill="#ffffff"/>
    <polygon points="34,92 98,92 89,104 43,104" fill="#ffffff"/>
    <polygon points="62,61 62,86 44,86" fill="#ffffff" fill-opacity="0.85"/>
  </g>
</svg>
